<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alerts — Weather Station Radio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7a2e1d}a:hover{color:#5a2014}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3b2416; padding: 14px; font-family: 'Barlow Condensed', sans-serif; color: #2a1d14; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; flex-direction: column; padding: 6px 6px 0">
    <span style="font-family: 'Righteous', sans-serif; font-size: 26px; letter-spacing: 1px; color: #e9c46a">Emergency Broadcast</span>
    <span style="font-size: 15px; letter-spacing: 3px; color: #d8c4a0; text-transform: uppercase">Push alerts from the station</span>
  </div>

  <div style="background: #f3e6c8; border: 4px solid #c9a24a; border-radius: 22px; padding: 6px 14px; display: flex; flex-direction: column">
    <sc-for list="{{switches}}" as="s" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed #b39a72">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 18px; font-weight: 700; color: #2a1d14">{{s.label}}</span>
          <span style="font-family: 'Courier Prime', monospace; font-size: 12px; color: #6b5642">{{s.rule}}</span>
        </div>
        <sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}">
          <button aria-label="Turn off" style="width: 64px; min-height: 44px; border-radius: 22px; border: 2px solid #2a1d14; background: #2a1d14; display: flex; align-items: center; justify-content: flex-end; padding: 4px">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: #f2a93b"></span>
          </button>
        </sc-if>
        <sc-if value="{{s.off}}" hint-placeholder-val="{{ false }}">
          <button aria-label="Turn on" style="width: 64px; min-height: 44px; border-radius: 22px; border: 2px solid #2a1d14; background: #d9c49a; display: flex; align-items: center; justify-content: flex-start; padding: 4px">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: #6b5642"></span>
          </button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="min-height: 52px; border-radius: 14px; border: 0; background: #c8402a; color: #fff7e6; font-family: 'Righteous', sans-serif; font-size: 16px; letter-spacing: 1px">CHECK NOW</button>
    <button style="min-height: 52px; border-radius: 14px; border: 2px solid #c9a24a; background: #1c1714; color: #f3e6c8; font-family: 'Righteous', sans-serif; font-size: 16px; letter-spacing: 1px">TEST BROADCAST</button>
  </div>

  <div style="background: #fff7e6; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-left: 0; box-shadow: 0 2px 0 #b39a72">
    <span style="font-family: 'Courier Prime', monospace; font-size: 12px; letter-spacing: 2px; color: #6b5642">— BROADCAST LOG —</span>
    <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; border-bottom: 1px dotted #b39a72; padding-bottom: 6px">
        <span style="font-family: 'Courier Prime', monospace; font-size: 14px; font-weight: 700; color: #2a1d14">{{l.title}}</span>
        <span style="font-family: 'Courier Prime', monospace; font-size: 12px; color: #6b5642">{{l.meta}}</span>
      </div>
    </sc-for>
  </div>

  <nav style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; background: #1c1714; border-radius: 18px; padding: 8px">
    <a href="Main.dc.html" style="text-decoration: none; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: #3b2416; color: #e9d8b4; font-weight: 600; letter-spacing: 1px; font-size: 14px">NOW</a>
    <a href="Forecast.dc.html" style="text-decoration: none; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: #3b2416; color: #e9d8b4; font-weight: 600; letter-spacing: 1px; font-size: 14px">7-DAY</a>
    <a href="Stations.dc.html" style="text-decoration: none; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: #3b2416; color: #e9d8b4; font-weight: 600; letter-spacing: 1px; font-size: 14px">STATIONS</a>
    <a href="Alerts.dc.html" style="text-decoration: none; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: #c9a24a; color: #1c1714; font-weight: 700; letter-spacing: 1px; font-size: 14px">ALERTS</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (label, rule, on) => ({ label, rule, on, off: !on });
    return {
      switches: [
        s('All alerts', 'MASTER SWITCH', true),
        s('Rain', 'CHANCE ≥ 60% IN 12 HRS', true),
        s('Freezing', 'LOW ≤ 32°F', true),
        s('Heat', 'HIGH ≥ 90°F', false),
        s('Wind', 'GUSTS ≥ 40 MPH', true),
        s('Official warnings', 'NATIONAL WEATHER SERVICE', true)
      ],
      log: [
        { title: 'RAIN LIKELY IN NEWARK', meta: '1:02 PM · 85% AROUND 4 PM · DELIVERED' },
        { title: 'WIND ADVISORY — NEWARK', meta: '9:15 AM · NWS · DELIVERED' },
        { title: 'FREEZING TEMPS IN CHICAGO', meta: 'YESTERDAY · LOW OF 28°F · DELIVERED' }
      ]
    };
  }
}
</script>
</body>
</html>
