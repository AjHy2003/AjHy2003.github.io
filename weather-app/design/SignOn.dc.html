<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Sign On — Weather Station Radio</title>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e9c46a}a:hover{color:#f3e6c8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3b2416; padding: 24px 18px; font-family: 'Barlow Condensed', sans-serif; color: #2a1d14; display: flex; flex-direction: column; gap: 18px; justify-content: center">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <svg width="120" height="70" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M 10 62 A 50 50 0 0 1 110 62" fill="none" stroke="#c9a24a" stroke-width="6" stroke-linecap="round"></path>
      <path d="M 26 62 A 34 34 0 0 1 94 62" fill="none" stroke="#e9c46a" stroke-width="3" stroke-dasharray="4 6"></path>
      <line x1="60" y1="62" x2="84" y2="24" stroke="#c8402a" stroke-width="4" stroke-linecap="round"></line>
      <circle cx="60" cy="62" r="7" fill="#c9a24a"></circle>
    </svg>
    <span style="font-family: 'Righteous', sans-serif; font-size: 38px; letter-spacing: 3px; color: #e9c46a">WX·RADIO</span>
    <span style="font-size: 16px; letter-spacing: 4px; color: #d8c4a0">YOUR PERSONAL WEATHER STATION</span>
  </div>

  <div style="background: #f3e6c8; border: 4px solid #c9a24a; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #d9c49a; border-radius: 12px; padding: 4px; gap: 4px">
      <button style="min-height: 44px; border: 0; border-radius: 9px; background: #2a1d14; color: #f3e6c8; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 2px">SIGN ON</button>
      <button style="min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #2a1d14; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 2px">NEW LISTENER</button>
    </div>
    <label for="u" style="font-size: 13px; letter-spacing: 3px; color: #6b5642">CALL SIGN (USERNAME)</label>
    <input id="u" placeholder="andrhenry449" style="font-family: 'Courier Prime', monospace; font-size: 17px; padding: 12px; border-radius: 12px; border: 2px solid #2a1d14; background: #fffaf0; color: #2a1d14">
    <label for="p" style="font-size: 13px; letter-spacing: 3px; color: #6b5642">PASSWORD</label>
    <input id="p" type="password" placeholder="••••••••" style="font-family: 'Courier Prime', monospace; font-size: 17px; padding: 12px; border-radius: 12px; border: 2px solid #2a1d14; background: #fffaf0; color: #2a1d14">
    <button style="margin-top: 6px; min-height: 52px; border-radius: 14px; border: 0; background: #c8402a; color: #fff7e6; font-family: 'Righteous', sans-serif; font-size: 18px; letter-spacing: 2px">GO ON AIR</button>
  </div>

  <span style="text-align: center; font-size: 15px; color: #d8c4a0">Sign on to save stations and get weather alerts on this phone.</span>
</div>
</x-dc>

</body>
</html>
